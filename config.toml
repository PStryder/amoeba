# Amoeba - real backend (one resident Qwen3-4B on the RTX 4080).
state_dir   = "F:/hexylab/amoeba-state"
runtime_dir = "F:/hexylab/amoeba-runtime/llama.cpp-b11057-win-cuda12.4"
models_dir  = "F:/hexylab/amoeba-models"

supervisor_host = "127.0.0.1"
supervisor_port = 8711
inference_port  = 8712
ego_port        = 8713
id_port         = 8714
log_level       = "INFO"

[backend]
kind         = "llama_cpp"
lib_path     = "F:/hexylab/amoeba-runtime/llama.cpp-b11057-win-cuda12.4/llama.dll"
model_path   = "F:/hexylab/amoeba-models/Qwen3-4B-Instruct-2507-Q5_K_M.gguf"
n_gpu_layers = -1
# n_ctx is the TOTAL shared KV pool. kv_unified is forced on: it is the only
# mode in which an Ego prefix can be physically shared with neuocytes.
#
# Sized against the card rather than guessed. Qwen3-4B is 36 layers with 8 KV
# heads and 128-wide keys and values, so at f16 one token costs
# 36 * 8 * (128+128) * 2 = 144 KiB of KV. The 4:1 GQA ratio is doing the work
# here; full MHA would be 576 KiB.
#
#   49152 tokens * 144 KiB = 6.75 GiB KV
#   + 2.69 GiB weights (Q5_K_M, all 36 layers resident, n_gpu_layers = -1)
#   + ~0.5 GiB compute buffers
#   = ~10 GiB of the 4080's 16, leaving ~3 GiB of headroom for the desktop
#     and for the graph to work in.
#
# 16384 was the previous value and it overcommitted: Ego and Id at the 6144
# prompt cap plus three maintenance neuocytes at the same cap want 30720
# tokens, and maintenance workers start from nothing rather than forking
# Ego's prefix, so they are charged in full. This removes that squeeze.
#
# It does NOT give any single role more context to think in. That is capped by
# `arbiter.max_prompt_tokens` below, which is a separate decision.
n_ctx        = 49152
n_seq_max    = 8
n_batch      = 1024
n_ubatch     = 512
n_threads    = 8
flash_attn   = true
type_k       = "f16"
type_v       = "f16"

[arbiter]
max_neuocytes              = 3
max_outstanding_work     = 64
max_prompt_tokens        = 6144
max_completion_tokens    = 512
neuocyte_wall_seconds      = 180.0
neuocyte_token_budget      = 512
lease_seconds            = 90.0
user_weight              = 0.7
maintenance_weight       = 0.3
user_reserved_slots      = 1
maintenance_reserved_slots = 1
max_maintenance_depth    = 2
max_maintenance_per_hour = 20

# Logical ceilings inside the shared 49152-token pool, not reservations.
# These are the numbers the Arbiter enforces and homeostasis measures against,
# and the ones the dashboard shows. There is no second, display-only value.
[ego]
max_context_tokens = 16384

[id]
max_context_tokens = 8192

[project]
name = "amoeba"
version = "0.1.0"
description = "A persistent local cognitive system (Ego/Id/neuocytes) exposed through MCP."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp==1.26.0",
    "pydantic==2.12.4",
    "anyio==4.12.0",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-timeout==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amoeba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
filterwarnings = ["error::DeprecationWarning:amoeba.*"]
